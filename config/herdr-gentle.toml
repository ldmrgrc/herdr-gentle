# Atajos de herdr para el ecosistema Gentle AI (sin Gentle Shell).
# install.sh inserta este bloque en ~/.config/herdr/config.toml entre marcadores,
# así se puede actualizar o quitar sin tocar el resto de tu configuración.

# Memoria Engram: navegador de memorias en un popup.
[[keys.command]]
key = "prefix+alt+m"
type = "popup"
command = "engram tui"
description = "gentle: engram (memoria)"
width = "90%"
height = "90%"

# Indexa el proyecto del panel activo con CodeGraph.
[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "gentle-ai codegraph init --cwd \"${HERDR_ACTIVE_PANE_CWD:-$PWD}\"; printf '\\n[enter para cerrar] '; read _"
description = "gentle: codegraph init (proyecto actual)"
width = "80%"
height = "60%"

# Diagnóstico completo: gentle-ai doctor + MCP + integraciones herdr.
[[keys.command]]
key = "prefix+alt+d"
type = "popup"
command = "herdr-gentle-doctor; printf '\\n[enter para cerrar] '; read _"
description = "gentle: doctor (skills, MCP, integraciones)"
width = "90%"
height = "90%"

# Re-sincroniza skills/config de Gentle AI tras actualizar gentle-ai.
[[keys.command]]
key = "prefix+alt+s"
type = "popup"
command = "gentle-ai sync; printf '\\n[enter para cerrar] '; read _"
description = "gentle: sync"
width = "90%"
height = "90%"

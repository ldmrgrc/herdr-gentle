id = "gentle.herdr"
name = "Gentle for Herdr"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Gentle Shell-style views in Herdr: per-agent model, context, tokens and cost in the sidebar; Agents, Usage and Changes dashboard; background subagents."
platforms = ["linux", "macos"]

# Publish usage for every agent once the server is up.
[[startup]]
command = ["node", "bin/report-usage.mjs"]

# Refresh one pane's usage whenever its agent changes state (turn start/end,
# approval prompt) or a new agent is detected. No polling daemon needed.
[[events]]
on = "pane.agent_status_changed"
command = ["node", "bin/report-usage.mjs"]

[[events]]
on = "pane.agent_detected"
command = ["node", "bin/report-usage.mjs"]

[[actions]]
id = "refresh-usage"
title = "Gentle: refresh usage"
contexts = ["workspace"]
command = ["node", "bin/report-usage.mjs"]

[[panes]]
id = "dashboard"
title = "Gentle"
placement = "overlay"
command = ["node", "bin/dashboard.mjs"]

[[panes]]
id = "usage"
title = "Gentle usage"
placement = "overlay"
command = ["node", "bin/dashboard.mjs", "consumo"]

[[panes]]
id = "changes"
title = "Gentle changes"
placement = "overlay"
command = ["node", "bin/dashboard.mjs", "cambios"]
